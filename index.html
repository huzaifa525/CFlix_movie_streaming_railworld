<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="./src/css/styles.css">
    <link rel="icon" href="netflix-images/prime-logo.png" type="image/png">
</head>

<body>
    <nav class="nav" id="nav"></nav>

    <header class="banner" id="banner">
        <div class="banner__slides" id="bannerSlides"></div>
        <div class="banner__content">
            <h1 id="bannerTitle"></h1>
            <p class="banner__details" id="bannerDetails"></p>
            <p id="bannerDescription"></p>
            <div class="actions">
                <a class="button button--white" id="bannerPlay" hidden><i class="fas fa-play"></i> Play</a>
                <button class="button button--ghost" id="bannerList" type="button" hidden></button>
                <button class="button button--ghost" id="surpriseButton" type="button" hidden><i class="fas fa-random"></i> Surprise Me</button>
            </div>
        </div>
        <div class="banner__dots" id="bannerDots"></div>
    </header>

    <main class="rows" id="rows"></main>

    <footer class="footer" id="footer"></footer>

    <script src="./src/js/common.js"></script>
    <script src="./src/js/index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - CFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="./src/css/styles.css">
    <link rel="icon" href="netflix-images/prime-logo.png" type="image/png">
</head>

<body>
    <nav class="nav" id="nav"></nav>

    <main class="page">
        <h1 class="page__title" id="browseTitle"></h1>
        <div class="filters" id="browseFilters">
            <div class="toggle" role="group" aria-label="Content type">
                <button type="button" data-type="movie">Movies</button>
                <button type="button" data-type="tv">Series</button>
            </div>
            <select id="languageFilter" aria-label="Language">
                <option value="all">All Languages</option>
            </select>
            <select id="sortFilter" aria-label="Sort by">
                <option value="popular">Most Popular</option>
                <option value="new">Newest</option>
                <option value="top">Top Rated</option>
                <option value="votes">Most Voted</option>
                <option value="az">A to Z</option>
            </select>
            <select id="yearFilter" aria-label="Release year">
                <option value="">Any Year</option>
            </select>
            <select id="ratingFilter" aria-label="Minimum rating">
                <option value="">Any Rating</option>
                <option value="6">6+ Rating</option>
                <option value="7">7+ Rating</option>
                <option value="8">8+ Rating</option>
            </select>
            <select id="runtimeFilter" aria-label="Length">
                <option value="">Any Length</option>
                <option value="short">Under 90 min</option>
                <option value="medium">90 to 150 min</option>
                <option value="long">Over 150 min</option>
            </select>
            <select id="statusFilter" aria-label="Series status">
                <option value="">Any Status</option>
                <option value="0">Still Running</option>
                <option value="3">Ended</option>
            </select>
            <select id="providerFilter" aria-label="Streaming service">
                <option value="">All Services</option>
            </select>
            <button class="filters__clear" id="clearFilters" type="button" hidden><i class="fas fa-times"></i> Clear filters</button>
        </div>
        <p class="filters__count" id="browseCount"></p>
        <div class="chips" id="moodChips"></div>
        <div class="chips" id="genreChips"></div>
        <div class="grid" id="browseGrid"></div>
        <p class="page__status" id="browseStatus" role="status"></p>
        <div id="loadMore"></div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="./src/js/common.js"></script>
    <script src="./src/js/browse.js"></script>
</body>

</html>
